name: CI - Tests et couverture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-backend:
    name: Tests back-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Java 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      - name: Tests et rapport JaCoCo
        run: mvn -B clean test

      - name: Publication du rapport JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: back/target/site/jacoco/

  test-frontend:
    name: Tests front-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node 16
        uses: actions/setup-node@v4
        with:
          node-version: "16"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Tests et couverture
        run: npm run test -- --watch=false --browsers=ChromeHeadlessCI --code-coverage

      - name: Publication du rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: front/coverage/
